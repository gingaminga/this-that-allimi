name: Toss Quiz Scraper

on:
  schedule:
    - cron: '0 0,2,4,6,8 * * *'  # 한국 시간 09:00, 11:00, 13:00, 15:00, 17:00 (2시간마다)
  workflow_dispatch:  # 수동 실행 가능

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # repository에 파일을 커밋할 수 있는 권한
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
        run_install: false
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
        
    - name: Run scraper
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.QUIZ_DISCORD_WEBHOOK_URL }}
      run: |
        pnpm quiz
        
    - name: Commit processed articles
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add quiz-allimi/processed_articles.json
        git diff --staged --quiet || git commit -m "Update processed articles [skip ci]"
        git push
